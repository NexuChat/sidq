source:
  type: postgres
  config:
    host_port: localhost:55432
    database: warehouse
    username: sidq
    password: sidq
    platform_instance: sidq-demo
    schema_pattern:
      allow:
        - raw
        - analytics
    include_tables: true
    include_views: true
    include_view_lineage: true
    include_view_column_lineage: true
    profiling:
      enabled: false
    stateful_ingestion:
      enabled: false

sink:
  type: datahub-rest
  config:
    server: http://localhost:8080
