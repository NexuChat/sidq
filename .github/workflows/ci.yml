name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Fetch sealed demo branches
        run: git fetch --no-tags --depth=1 origin "+refs/heads/demo/*:refs/remotes/origin/demo/*"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-build-isolation --no-deps -e .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src/

      - name: Pytest
        run: pytest -q --cov=sidq --cov-report=term-missing:skip-covered

      - name: Validate the pull request with the local composite action
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          token: ${{ github.token }}
          mode: fixture
          publish-results: false
