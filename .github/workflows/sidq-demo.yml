name: Sidq demo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write

concurrency:
  group: sidq-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  verdict:
    name: Sidq fixture verdict
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run is privileged: execute only the default/base branch.
      # Never restore PR caches, download PR artifacts, or run proposed code.
      - name: Check out trusted Sidq action
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install trusted publisher
        run: |
          python -m venv "${RUNNER_TEMP}/sidq-publisher"
          "${RUNNER_TEMP}/sidq-publisher/bin/pip" install --require-hashes -r requirements-action.lock
          "${RUNNER_TEMP}/sidq-publisher/bin/pip" install --no-build-isolation --no-deps .

      - name: Resolve current validated pull request
        id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"${RUNNER_TEMP}/sidq-publisher/bin/python" -m sidq.bot.repository --prepare'

      - name: Check out pull request files as data
        if: steps.context.outputs.ready == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ steps.context.outputs.head_repository }}
          ref: ${{ steps.context.outputs.head_sha }}
          path: .sidq-pr
          persist-credentials: false

      - name: Assess applicability and publish the data check
        if: steps.context.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIDQ_DATAHUB_UI_URL: https://datahub.mlki.app
        run: '"${RUNNER_TEMP}/sidq-publisher/bin/python" -m sidq.bot.repository'
