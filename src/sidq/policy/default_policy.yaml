version: 1
settings:
  wide_blast_radius_threshold: 5
rules:
  - id: catalog_reality_mismatch
    match:
      evidence_kind: catalog_reality_mismatch
    severity: block
    reason_code: STALE_CONTEXT
    message: >-
      The catalog disagrees with the live source for {subject}.
      Graph: {detail.graph_fields}. Source: {detail.live_fields}.
  - id: unknown_field
    match:
      evidence_kind: unknown_field
    severity: block
    message: >-
      Referenced field is not present in the catalog: {subject}.
  - id: pii_exposure
    match:
      evidence_kind: pii_exposure
    severity: block
    message: >-
      PII exposure is not permitted for {subject}.
  - id: assertion_dependency_break
    match:
      evidence_kind: assertion_dependency_break
    severity: block
    message: >-
      A required assertion depends on a removed or renamed field in {subject}.
  - id: critical_downstream
    match:
      evidence_kind: blast_radius
      where_any:
        - field: detail.critical_assets
          op: not_empty
        - field: detail.cross_team_owners
          op: not_empty
    severity: block
    message: >-
      This change has critical or cross-team downstream consumers for {subject}.
  - id: wide_blast_radius
    match:
      evidence_kind: blast_radius
      where:
        - field: detail.downstream_count
          op: gt
          value: "$settings.wide_blast_radius_threshold"
    severity: warn
    message: >-
      This change affects {detail.downstream_count} downstream consumers for {subject}.
  - id: deprecated_upstream
    match:
      evidence_kind: deprecated_upstream
    severity: warn
    message: >-
      This change depends on a deprecated upstream asset: {subject}.
  - id: unowned_asset
    match:
      evidence_kind: unowned_asset
    severity: warn
    message: >-
      The touched asset has no owner: {subject}.
  - id: lineage_rot
    match:
      evidence_kind: lineage_rot_missing
    severity: warn
    message: >-
      The catalog claims a column lineage edge that the current SQL does not produce for {subject}.
  - id: lineage_rot_extra
    match:
      evidence_kind: lineage_rot_extra
    severity: warn
    message: >-
      The current SQL produces a column lineage edge the catalog does not know for {subject}.
  - id: lineage_field_missing
    match:
      evidence_kind: lineage_field_missing
    severity: warn
    message: >-
      A stored lineage edge targets a schema field that the catalog does not list: {subject}.
  - id: pii_leak_untagged
    match:
      evidence_kind: pii_leak_untagged
    severity: warn
    message: >-
      A field-level PII tag is not preserved by the catalog lineage edge into {subject}.
  - id: doc_references_missing_column
    match:
      evidence_kind: doc_references_missing_column
    severity: warn
    message: >-
      Catalog documentation references a column absent from the listed schema: {subject}.
  - id: orphan_lineage
    match:
      evidence_kind: orphan_lineage
    severity: warn
    message: >-
      A catalog lineage edge references an entity that is absent from this catalog snapshot: {subject}.
  - id: deprecated_upstream_of_live
    match:
      evidence_kind: deprecated_upstream_of_live
    severity: warn
    message: >-
      A deprecated catalog asset still feeds a live chart or dashboard: {subject}.
  # unowned_consumed deliberately has no policy rule. It is retained as
  # informational catalog-health evidence and never changes a PR verdict.
  # lineage_unverifiable deliberately has no policy rule. The policy engine
  # retains unmatched evidence as informational and therefore cannot give it a
  # blocking or warning severity.
