version: 1
unhandled_evidence: block
settings:
  wide_blast_radius_threshold: 5
rules:
  # These are refusals to certify, not findings that the proposed change is unsafe.
  # A merge gate cannot pass a change that it could not inspect.
  - id: unresolved_asset
    match:
      evidence_kind: unresolved_asset
    severity: block
    reason_code: UNVERIFIABLE_CHANGE
    message: >-
      Sidq could not inspect {subject} because it could not map the changed file to an asset.
      This is a refusal to certify the change, not a claim that the change is unsafe.
  - id: unparseable_sql
    match:
      evidence_kind: unparseable_sql
    severity: block
    reason_code: UNVERIFIABLE_CHANGE
    message: >-
      Sidq could not inspect the SQL for {subject}.
      This is a refusal to certify the change, not a claim that the change is unsafe.
  - id: graph_unavailable
    match:
      evidence_kind: graph_unavailable
    severity: block
    reason_code: UNVERIFIABLE_CHANGE
    message: >-
      Sidq could not inspect the required graph data for {subject}.
      This is a refusal to certify the change, not a claim that the change is unsafe.
  - id: catalog_reality_mismatch
    match:
      evidence_kind: catalog_reality_mismatch
    severity: block
    reason_code: STALE_CONTEXT
    message: >-
      The catalog disagrees with the live source for {subject}.
      Graph: {detail.graph_fields}. Source: {detail.live_fields}.
  - id: unknown_field
    match:
      evidence_kind: unknown_field
    severity: block
    message: >-
      Referenced field is not present in the catalog: {subject}.
  - id: unknown_dataset
    match:
      evidence_kind: unknown_dataset
    severity: block
    reason_code: UNVERIFIABLE_CHANGE
    message: >-
      Sidq could not inspect the referenced dataset {subject} because it is absent from the catalog.
      This is a refusal to certify the change, not a claim that the change is unsafe.
  - id: type_mismatch
    match:
      evidence_kind: type_mismatch
    severity: block
    message: >-
      The referenced field type for {subject} is incompatible with the catalog type.
  - id: pii_exposure
    match:
      evidence_kind: pii_exposure
    severity: block
    message: >-
      A proven proposed PII route reaches an unapproved destination from {subject}.
  - id: assertion_dependency_break
    match:
      evidence_kind: assertion_dependency_break
    severity: block
    message: >-
      A required assertion depends on a removed or renamed field in {subject}.
  - id: critical_downstream
    match:
      evidence_kind: blast_radius
      where_any:
        - field: detail.critical_assets
          op: not_empty
        - field: detail.cross_team_owners
          op: not_empty
    severity: block
    message: >-
      This change has critical or cross-team downstream consumers for {subject}.
  - id: partial_blast_radius
    match:
      evidence_kind: blast_radius
      where_any:
        - field: detail.unreadable_assets
          op: not_empty
    severity: block
    reason_code: UNVERIFIABLE_CHANGE
    message: >-
      Sidq could not fully read downstream governance for {subject}, so ownership
      and criticality could not be ruled out. This is a refusal to certify the
      change, not a claim that the change is unsafe.
  - id: wide_blast_radius
    match:
      evidence_kind: blast_radius
      where:
        - field: detail.downstream_count
          op: gt
          value: "$settings.wide_blast_radius_threshold"
    severity: warn
    message: >-
      This change affects {detail.downstream_count} downstream consumers for {subject}.
  - id: deprecated_upstream
    match:
      evidence_kind: deprecated_upstream
    severity: warn
    message: >-
      This change depends on a deprecated upstream asset: {subject}.
  - id: unowned_asset
    match:
      evidence_kind: unowned_asset
    severity: warn
    message: >-
      The touched asset has no owner: {subject}.
  - id: access_policy_conflict
    match:
      evidence_kind: access_policy_conflict
    severity: warn
    message: >-
      A proven proposed route sends restricted data to an unrestricted asset from {subject}.
  - id: doc_rot
    match:
      evidence_kind: doc_rot
    severity: warn
    message: >-
      Documentation no longer matches the post-change schema for {subject}.
  - id: doc_claim_violated
    match:
      evidence_kind: doc_claim_violated
    severity: warn
    message: >-
      Documentation claim was contradicted by the live source for {subject}.
  - id: doc_claim_unverifiable
    match:
      evidence_kind: doc_claim_unverifiable
    severity: block
    reason_code: UNVERIFIABLE_CHANGE
    message: >-
      Sidq could not inspect the live documentation claim for {subject}.
      This is a refusal to certify the change, not a claim that the change is unsafe.
  - id: constraint_contradicts_catalog
    match:
      evidence_kind: constraint_contradicts_catalog
    severity: warn
    message: >-
      The catalog constraint claim disagrees with the live database for {subject}.
  - id: lineage_rot
    match:
      evidence_kind: lineage_rot_missing
    severity: warn
    message: >-
      The catalog claims a column lineage edge that the current SQL does not produce for {subject}.
  - id: lineage_rot_extra
    match:
      evidence_kind: lineage_rot_extra
    severity: warn
    message: >-
      The current SQL produces a column lineage edge the catalog does not know for {subject}.
  - id: lineage_field_missing
    match:
      evidence_kind: lineage_field_missing
    severity: warn
    message: >-
      A stored lineage edge targets a schema field that the catalog does not list: {subject}.
  - id: pii_leak_untagged
    match:
      evidence_kind: pii_leak_untagged
    severity: warn
    message: >-
      A field-level PII tag is not preserved by the catalog lineage edge into {subject}.
  - id: doc_references_missing_column
    match:
      evidence_kind: doc_references_missing_column
    severity: warn
    message: >-
      Catalog documentation references a column absent from the listed schema: {subject}.
  - id: orphan_lineage
    match:
      evidence_kind: orphan_lineage
    severity: warn
    message: >-
      A catalog lineage edge references an entity that is absent from this catalog snapshot: {subject}.
  - id: deprecated_upstream_of_live
    match:
      evidence_kind: deprecated_upstream_of_live
    severity: warn
    message: >-
      A deprecated catalog asset still feeds a live chart or dashboard: {subject}.
  # Informational evidence is explicit: an unrecognized kind fails closed rather
  # than silently becoming a passing observation.
  - id: doc_claim_holds
    match:
      evidence_kind: doc_claim_holds
    severity: info
    message: >-
      The live source supports the documentation claim for {subject}.
  - id: constraint_confirmed
    match:
      evidence_kind: constraint_confirmed
    severity: info
    message: >-
      The live source enforces the catalog constraint claim for {subject}.
  - id: constraint_missing_in_catalog
    match:
      evidence_kind: constraint_missing_in_catalog
    severity: info
    message: >-
      The live source enforces a constraint not represented in the catalog for {subject}.
  - id: constraint_unverifiable
    match:
      evidence_kind: constraint_unverifiable
    severity: info
    message: >-
      Constraint equivalence could not be established for {subject}; no contradiction is claimed.
  - id: lineage_unverifiable
    match:
      evidence_kind: lineage_unverifiable
    severity: info
    message: >-
      Catalog-health lineage could not be assessed for {subject}.
  - id: unowned_consumed
    match:
      evidence_kind: unowned_consumed
    severity: info
    message: >-
      A non-change-scoped consumed asset has no owner: {subject}.
  - id: deprecated_upstream_of_live_unverifiable
    match:
      evidence_kind: deprecated_upstream_of_live_unverifiable
    severity: info
    message: >-
      Deprecated-upstream catalog health could not be assessed for {subject}.
  - id: doc_references_missing_column_unverifiable
    match:
      evidence_kind: doc_references_missing_column_unverifiable
    severity: info
    message: >-
      Documentation-reference catalog health could not be assessed for {subject}.
  - id: lineage_field_missing_unverifiable
    match:
      evidence_kind: lineage_field_missing_unverifiable
    severity: info
    message: >-
      Field-lineage catalog health could not be assessed for {subject}.
  - id: orphan_lineage_unverifiable
    match:
      evidence_kind: orphan_lineage_unverifiable
    severity: info
    message: >-
      Orphan-lineage catalog health could not be assessed for {subject}.
  - id: pii_leak_untagged_unverifiable
    match:
      evidence_kind: pii_leak_untagged_unverifiable
    severity: info
    message: >-
      PII-lineage catalog health could not be assessed for {subject}.
  - id: unowned_consumed_unverifiable
    match:
      evidence_kind: unowned_consumed_unverifiable
    severity: info
    message: >-
      Consumed-asset ownership could not be assessed for {subject}.
  #
