[project]
name = "sidq"
version = "0.1.0"
description = "DataHub-native pre-merge gate for data code, with attested Sidq receipts"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "sqlglot",  # SQL parsing for the schema gate — deterministic, no LLM
    "pyyaml",   # restricted policy and asset-map loading
    "mcp",      # official MCP client, talks to mcp-server-datahub
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "ruff", "types-PyYAML"]
advisory = ["transformers>=5.0", "torch>=2.5"]
# Kept out of the default install: these packages and the model weights are
# only required for the CPU LoRA experiment in scripts/train_lora.py.
train = [
    "accelerate>=1.0",
    "scikit-learn>=1.5",
    "datasets>=3.0",
    "peft>=0.17",
    "safetensors>=0.5",
    "torch>=2.5",
    "transformers>=5.0",
    "trl>=0.20",
]

[project.scripts]
sidq = "sidq.cli:main"
sidq-mcp = "sidq.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.format]
exclude = [
    "data/claims/**",
    "docs/**",
    "examples/**",
    "research/**",
    "scripts/**",
    "tests/test_published_artifact_granularity.py",
]

[tool.ruff.lint.per-file-ignores]
"tests/test_published_artifact_granularity.py" = ["I001"]
"scripts/**" = ["BLE001", "PLW1510", "S110", "S112", "SIM101", "SIM102", "SIM103", "FLY002", "PERF102", "UP022", "F841"]
"data/claims/**" = ["BLE001", "PLW1510", "S110", "S112", "UP022"]

[tool.mypy]
python_version = "3.12"
strict = false

[[tool.mypy.overrides]]
module = ["sidq.*"]
disallow_untyped_defs = true
