[project]
name = "sidq"
version = "0.1.0"
description = "DataHub-native pre-merge gate for data code, with attested Sidq receipts"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "sqlglot",  # SQL parsing for the schema gate — deterministic, no LLM
    "pyyaml",   # restricted policy and asset-map loading
    "mcp",      # official MCP client, talks to mcp-server-datahub
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sidq = "sidq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
